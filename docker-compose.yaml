services:
  backend:
    container_name: "td4_backend"
    hostname: "td4_backend"
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      VERSION: "v1"
      DB_HOST: ${DB_HOST}
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/backend
      - td4_backend_dist:/usr/src/backend/dist
      - td4_backend_node_modules:/usr/src/backend/node_modules

  frontend:
    container_name: "td4_frontend"
    hostname: "td4_frontend"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      FRONTEND_PORT: "5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/frontend
      - td4_frontend_node_modules:/usr/src/frontend/node_modules

  pgsql:
    image: "postgres:16"
    container_name: "td4_pgsql"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - proxy
    volumes:
      - td4_pgsql_data:/var/lib/postgresql/data

  adminer:
    image: adminer:5.4.2
    container_name: "td4_adminer"
    hostname: "td4_adminer"
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: pgsql
    depends_on:
      - pgsql
    networks:
      - proxy

networks:
  proxy:
    driver: bridge
    external: true

volumes:
  td4_backend_dist:
  td4_backend_node_modules:
  td4_frontend_node_modules:
  td4_pgsql_data:
