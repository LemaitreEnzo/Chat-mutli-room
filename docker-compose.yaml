services:
  backend:
    container_name: "td4_backend"
    hostname: "td4_backend"
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      VERSION: "v1"
      DB_HOST: ${DB_HOST}
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3000:3000"
    networks:
      - proxy
    volumes:
      - ./backend:/usr/src/backend
      - backend_dist:/usr/src/backend/dist
      - backend_node_modules:/usr/src/backend/node_modules

  frontend:
    container_name: "td4_frontend"
    hostname: "td4_frontend"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      FRONTEND_PORT: "5173"
    ports:
      - "5173:5173"
    networks:
      - proxy
    volumes:
      - ./frontend:/usr/src/frontend
      - frontend_node_modules:/usr/src/frontend/node_modules

  pgsql:
    image: "postgres:16"
    container_name: "td4_pgsql"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-instant-jobs}",
        ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - proxy
    volumes:
      - pgsql_data:/var/lib/postgresql/data

  adminer:
    image: adminer:5.4.2
    container_name: "td4_adminer"
    hostname: "td4_adminer"
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ${DB_HOST}
    depends_on:
      - pgsql
    networks:
      - proxy

networks:
  proxy:
    driver: bridge
    external: true

volumes:
  backend_dist:
  backend_node_modules:
  frontend_node_modules:
  pgsql_data:
